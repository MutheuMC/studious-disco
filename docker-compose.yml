services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobnest
      POSTGRES_PASSWORD: jobnest
      POSTGRES_DB: jobnest
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jobnest_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobnest"]
      interval: 5s
      retries: 10
volumes:
  jobnest_data:
